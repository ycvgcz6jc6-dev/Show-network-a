- key: sound_console
  label_fr: Console son / Sound console
  label_en: Sound console / audio
  description_fr: 'Profil générique pour commandes typiques de console son : faders,
    mute, master, transport et snapshots. Les adresses restent éditables.'
  description_en: 'Generic profile for common sound-console controls: faders, mute,
    master, transport and snapshots. Addresses remain editable.'
  setup_steps_fr:
  - Activer l'entrée OSC sur la console son.
  - Choisir le port OSC et l'interface réseau.
  - Définir les adresses OSC de la console ou utiliser celles proposées.
  - Tester avec le moniteur OSC avant d'activer les mappings.
  setup_steps_en:
  - Enable OSC input on the sound console.
  - Choose the OSC port and network interface.
  - Define the console's OSC addresses or use the suggested ones.
  - Test with the OSC monitor before enabling mappings.
  actions:
  - key: channel_fader
    label_fr: Fader canal
    label_en: Channel fader
    address: /ch/1/fader
    value_type: float
    destination_domain: media_player
    destination_attribute: volume_level
    notes_fr: ''
    notes_en: ''
  - key: channel_mute
    label_fr: Mute canal
    label_en: Channel mute
    address: /ch/1/mute
    value_type: bool
    destination_domain: switch
    destination_attribute: turn_on
    notes_fr: ''
    notes_en: ''
  - key: master
    label_fr: Master
    label_en: Master
    address: /master/fader
    value_type: float
    destination_domain: media_player
    destination_attribute: volume_level
    notes_fr: ''
    notes_en: ''
  - key: snapshot
    label_fr: Snapshot
    label_en: Snapshot
    address: /snapshot
    value_type: integer
    destination_domain: event
    destination_attribute: event_type
    notes_fr: ''
    notes_en: ''
  - key: transport_play
    label_fr: Play
    label_en: Play
    address: /transport/play
    value_type: bool
    destination_domain: media_player
    destination_attribute: play
    notes_fr: ''
    notes_en: ''
- key: generic
  label_fr: OSC générique
  label_en: Generic OSC
  description_fr: Aucun constructeur imposé. Créez vos adresses librement.
  description_en: No vendor assumed. Create your own addresses.
  setup_steps_fr:
  - Choisir le port d'écoute.
  - Créer ou apprendre une adresse OSC.
  - Tester puis activer le mapping.
  setup_steps_en:
  - Choose the listening port.
  - Create or learn an OSC address.
  - Test then enable the mapping.
  actions: []
