- key: grandma3
  label_fr: grandMA3 / MA
  label_en: grandMA3 / MA
  description_fr: Commandes OSC courantes pour executors, faders, encoders et /cmd.
  description_en: Common OSC controls for executors, faders, encoders and /cmd.
  setup_steps_fr:
  - 'Dans grandMA3 : Menu → In & Out → OSC.'
  - Activer Enable Input sur la ligne OSC utilisée.
  - Configurer le Prefix si vous en utilisez un.
  - Activer Receive pour les données OSC.
  - Pour /cmd, activer séparément Receive Command.
  - Vérifier l'adresse IP et le port OSC du réseau de contrôle.
  setup_steps_en:
  - 'In grandMA3: Menu → In & Out → OSC.'
  - Enable Input on the OSC configuration line.
  - Configure Prefix if you use one.
  - Enable Receive for OSC data.
  - For /cmd, enable Receive Command separately.
  - Verify the control-network IP address and OSC port.
  actions:
  - key: executor_fader
    label_fr: Fader Executor
    label_en: Executor fader
    address: /Page1/Fader201
    value_type: float
    destination_domain: grandma3
    destination_attribute: fader
    notes_fr: 'Exemple : 0–100 selon FaderRange.'
    notes_en: 'Example: 0–100 depending on FaderRange.'
  - key: executor_key
    label_fr: Touche Executor
    label_en: Executor key
    address: /Page1/Key201
    value_type: bool
    destination_domain: grandma3
    destination_attribute: key
    notes_fr: Peut servir à Go+, Flash, etc. selon l'affectation.
    notes_en: Can trigger Go+, Flash, etc. depending on assignment.
  - key: executor_encoder
    label_fr: Encodeur Executor
    label_en: Executor encoder
    address: /Page1/Encoder201
    value_type: float
    destination_domain: grandma3
    destination_attribute: encoder
    notes_fr: Valeur relative selon la fonction de l'encodeur.
    notes_en: Relative value depending on encoder function.
  - key: command
    label_fr: Commande /cmd
    label_en: /cmd command
    address: /cmd
    value_type: string
    destination_domain: grandma3
    destination_attribute: command
    notes_fr: Nécessite Receive Command. À utiliser avec prudence.
    notes_en: Requires Receive Command. Use with care.
- key: chamsys_magicq
  label_fr: ChamSys MagicQ
  label_en: ChamSys MagicQ
  description_fr: Banque OSC documentée pour playbacks, Execute, blackout et feedback.
  description_en: Documented OSC bank for playbacks, Execute, blackout and feedback.
  setup_steps_fr:
  - Activer OSC dans Setup → View Settings → Network.
  - Choisir Rx/Tx et les ports.
  - Tester une commande avant d'activer les automatisations.
  setup_steps_en:
  - Enable OSC in Setup → View Settings → Network.
  - Choose Rx/Tx and ports.
  - Test a command before enabling automations.
  actions:
  - key: pb_go
    label_fr: GO Playback
    label_en: Playback GO
    address: /pb/{playback}/go
    value_type: bool
    destination_domain: chamsys
    destination_attribute: go
    notes_fr: Playback 1–10 dans les adresses intégrées.
    notes_en: Built-in addresses cover playbacks 1–10.
  - key: pb_fader
    label_fr: Fader Playback
    label_en: Playback fader
    address: /pb/{playback}
    value_type: float
    destination_domain: chamsys
    destination_attribute: fader
    notes_fr: 0.0–1.0 ou 0–100.
    notes_en: 0.0–1.0 or 0–100.
  - key: pb_flash
    label_fr: Flash Playback
    label_en: Playback flash
    address: /pb/{playback}/flash
    value_type: bool
    destination_domain: chamsys
    destination_attribute: flash
    notes_fr: Non-zéro = flash.
    notes_en: Non-zero = flash.
  - key: pb_release
    label_fr: Release Playback
    label_en: Playback release
    address: /pb/{playback}/release
    value_type: bool
    destination_domain: chamsys
    destination_attribute: release
    notes_fr: ''
    notes_en: ''
  - key: blackout
    label_fr: Blackout
    label_en: Blackout
    address: /dbo
    value_type: bool
    destination_domain: chamsys
    destination_attribute: blackout
    notes_fr: 0/1 selon le comportement MagicQ.
    notes_en: 0/1 according to MagicQ behavior.
  - key: exec
    label_fr: Execute
    label_en: Execute item
    address: /exec/{page}/{item}
    value_type: bool
    destination_domain: chamsys
    destination_attribute: execute
    notes_fr: ''
    notes_en: ''
- key: yamaha_rivage
  label_fr: Yamaha RIVAGE PM
  label_en: Yamaha RIVAGE PM
  description_fr: Banque basée sur la spécification OSC officielle RIVAGE PM.
  description_en: Bank based on the official RIVAGE PM OSC specification.
  setup_steps_fr:
  - Configurer OSC selon la documentation RIVAGE PM.
  - Choisir la console/cible.
  - Utiliser uniquement les paramètres proposés par la spécification du modèle.
  setup_steps_en:
  - Configure OSC according to the RIVAGE PM documentation.
  - Choose the console/target.
  - Use only parameters documented for the model.
  actions:
  - key: active_cue
    label_fr: Active Cue
    label_en: Active Cue
    address: /yosc:req/set/MIXER:Current/Cue/ActiveCue
    value_type: string
    destination_domain: yamaha_rivage
    destination_attribute: cue
    notes_fr: ''
    notes_en: ''
  - key: cue_mode
    label_fr: Cue Mode
    label_en: Cue mode
    address: /yosc:req/set/MIXER:Current/Cue/CueMode
    value_type: string
    destination_domain: yamaha_rivage
    destination_attribute: cue_mode
    notes_fr: MIX ou LAST.
    notes_en: MIX or LAST.
  - key: dca_cue
    label_fr: DCA Cue ON/OFF
    label_en: DCA cue ON/OFF
    address: /yosc:req/set/MIXER:Current/Cue/DCA/On
    value_type: int
    destination_domain: yamaha_rivage
    destination_attribute: dca_cue
    notes_fr: ''
    notes_en: ''
- key: qlab
  label_fr: QLab
  label_en: QLab
  description_fr: Commandes OSC QLab courantes avec support UDP/TCP et réponses documentées.
  description_en: Common QLab OSC commands with documented UDP/TCP and replies.
  setup_steps_fr:
  - Configurer OSC dans QLab.
  - Choisir la cible et le port.
  - Tester /go avant une automatisation de spectacle.
  setup_steps_en:
  - Configure OSC in QLab.
  - Choose target and port.
  - Test /go before a show automation.
  actions:
  - key: go
    label_fr: GO
    label_en: GO
    address: /go
    value_type: none
    destination_domain: qlab
    destination_attribute: go
    notes_fr: ''
    notes_en: ''
  - key: panic
    label_fr: Panic
    label_en: Panic
    address: /panic
    value_type: none
    destination_domain: qlab
    destination_attribute: panic
    notes_fr: 'Commande sensible : laisser la confirmation active.'
    notes_en: 'Sensitive command: keep confirmation enabled.'
  - key: save
    label_fr: Save
    label_en: Save
    address: /save
    value_type: none
    destination_domain: qlab
    destination_attribute: save
    notes_fr: ''
    notes_en: ''
  - key: updates_on
    label_fr: Updates ON
    label_en: Enable updates
    address: /updates
    value_type: int
    destination_domain: qlab
    destination_attribute: updates
    notes_fr: 1 = activer, 0 = désactiver.
    notes_en: 1 = enable, 0 = disable.
