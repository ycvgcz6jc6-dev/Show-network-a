  name: Effacer l'historique des règles
  description: Efface uniquement la trace runtime des évaluations du Rule Builder.


create_control_mapping:
  name: Create control mapping
  description: Map an incoming OSC or MIDI control to a Home Assistant service target.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    mapping_id:
      required: true
      selector: {text: {}}
    address:
      required: true
      selector: {text: {}}
    destination:
      required: true
      selector: {text: {}}
    target:
      required: true
      selector: {entity: {}}
    attribute:
      required: false
      selector: {text: {}}
    in_min:
      required: false
      default: 0
      selector: {number: {mode: box}}
    in_max:
      required: false
      default: 1
      selector: {number: {mode: box}}
    out_min:
      required: false
      default: 0
      selector: {number: {mode: box}}
    out_max:
      required: false
      default: 1
      selector: {number: {mode: box}}
    invert:
      required: false
      default: false
      selector: {boolean: {}}
    min_interval_ms:
      required: false
      default: 200
      selector: {number: {min: 0, max: 10000, mode: box}}
    deadband:
      required: false
      default: 0
      selector: {number: {min: 0, max: 100, mode: box}}

remove_control_mapping:
  name: Remove control mapping
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    mapping_id:
      required: true
      selector: {text: {}}

create_dmx_ha_mapping:
  name: Create DMX to Home Assistant mapping
  description: Map incoming DMX channels to a Home Assistant entity/service. No DMX output is generated.
  fields:
    entry_id:
      required: false
      selector:
        text:
    mapping_id:
      required: true
      selector:
        text:
    universe:
      required: true
      selector:
        number:
          min: 1
          max: 63999
          mode: box
    source:
      required: false
      selector:
        text:
    channels:
      required: true
      description: DMX channel expression, e.g. 101 or 101-103.
      selector:
        text:
    entity_id:
      required: false
      selector:
        entity:
    domain:
      required: false
      default: light
      selector:
        text:
    service:
      required: false
      default: turn_on
      selector:
        text:
    mode:
      required: false
      default: dimmer
      selector:
        select:
          options: [dimmer, rgb, rgbw, cct, switch, service]
    min_interval_ms:
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    deadband:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    invert:
      required: false
      default: false
      selector:
        boolean:
    dimmer_curve:
      required: false
      default: linear
      description: Dimmer curve applied before converting DMX to Home Assistant brightness.
      selector:
        select:
          options: [linear, gamma_1_8, gamma_2_0, gamma_2_2, gamma_2_4, logarithmic, dali_log, s_curve]
    enabled:
      required: false
      default: true
      selector:
        boolean:
    data:
      required: false
      selector:
        object:

remove_dmx_ha_mapping:
  name: Remove DMX to Home Assistant mapping
