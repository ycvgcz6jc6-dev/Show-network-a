create_rule:
  name: Create DMX rule
  description: Create or replace a persistent DMX rule. Actions are Home Assistant service calls only.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:
    universe:
      required: true
      selector:
        number:
          min: 1
          max: 63999
          mode: box
    source:
      required: false
      selector:
        text:
    channels:
      required: true
      description: Channel expression such as 1-8,12,15-20.
      selector:
        text:
    mode:
      required: false
      default: any
      selector:
        select:
          options: [any, all, x_of_y]
    x:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 512
          mode: box
    threshold_on:
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 255
          mode: box
    threshold_off:
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box
    on_delay_ms:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600000
          mode: box
    off_delay_ms:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600000
          mode: box
    enabled:
      required: false
      default: false
      selector:
        boolean:
    test_mode:
      required: false
      default: false
      selector:
        boolean:
    action:
      required: false
      selector:
        object:
    off_action:
      required: false
      selector:
        object:

remove_rule:
  name: Remove DMX rule
  description: Remove a persistent DMX rule by name.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:

