create_rule:
  name: Create DMX rule
  description: Create or replace a persistent DMX rule. Actions are Home Assistant service calls only.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:
    universe:
      required: true
      selector:
        number:
          min: 1
          max: 63999
          mode: box
    source:
      required: false
      selector:
        text:
    channels:
      required: true
      description: Channel expression such as 1-8,12,15-20.
      selector:
        text:
    mode:
      required: false
      default: any
      selector:
        select:
          options: [any, all, x_of_y]
    x:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 512
          mode: box
    threshold_on:
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 255
          mode: box
    threshold_off:
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box
    on_delay_ms:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600000
          mode: box
    off_delay_ms:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600000
          mode: box
    enabled:
      required: false
      default: false
      selector:
        boolean:
    test_mode:
      required: false
      default: false
      selector:
        boolean:
    action:
      required: false
      selector:
        object:
    off_action:
      required: false
      selector:
        object:

remove_rule:
  name: Remove DMX rule
  description: Remove a persistent DMX rule by name.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:

set_rule_enabled:
  name: Enable or disable DMX rule
  description: Enable or disable a persistent DMX rule.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

set_rule_test_mode:
  name: Set DMX rule test mode
  description: Enable simulation mode for a persistent DMX rule.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

update_rule:
  name: Update rule
  description: Replace an existing DMX rule and persist the new definition.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    old_name:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    universe:
      required: true
      selector:
        number:
          min: 1
          max: 63999
          mode: box
    channels:
      required: true
      selector:
        text:
    source:
      required: false
      selector:
        text:
    mode:
      required: false
      default: any
      selector:
        select:
          options: [any, all, x_of_y]
    x:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 512
          mode: box
    threshold_on:
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 255
          mode: box
    threshold_off:
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 255
          mode: box
    on_delay_ms:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600000
          mode: box
    off_delay_ms:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600000
          mode: box
    action:
      required: false
      selector:
        object:
    off_action:
      required: false
      selector:
        object:
    enabled:
      required: false
      default: false
      selector:
        boolean:
    test_mode:
      required: false
      default: false
      selector:
        boolean:


set_light_sync_enabled:
  name: Set light sync safety gate
  description: Arm or disarm Home Assistant light/scene actions triggered by Show Network rules. Lighting protocols remain receive-only.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:


set_projector_control_enabled:
  name: Enable projector control
  description: Explicitly arm or disarm projector OUT commands. OFF by default.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

projector_power:
  name: Projector power
  description: Send a power command using the configured projector transport only when projector control is armed.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    host:
      required: true
      selector:
        text:
    port:
      required: false
      default: 4352
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    "on":
      required: true
      selector:
        boolean:

projector_input:
  name: Projector input
  description: Select an input using the configured projector transport when projector control is armed.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    host:
      required: true
      selector:
        text:
    port:
      required: false
      default: 4352
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    input:
      required: true
      selector:
        text:

projector_mute:
  name: Projector AV mute
  description: Set projector AV mute/shutter using the configured transport when projector control is armed.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    host:
      required: true
      selector:
        text:
    port:
      required: false
      default: 4352
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    mute:
      required: true
      selector:
        boolean:

test_rule:
  name: Test DMX rule
  description: Test a DMX rule against the current matching live universe, without executing any Home Assistant action or changing the live rule state.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    name:
      required: true
      selector:
        text:
    values:
      required: false
      description: Optional 512-value DMX snapshot for deterministic testing.
      selector:
        object:


clear_rule_history:
  name: Effacer l'historique des règles
  description: Efface uniquement la trace runtime des évaluations du Rule Builder.


create_control_mapping:
  name: Create control mapping
  description: Map an incoming OSC or MIDI control to a Home Assistant service target.
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    mapping_id:
      required: true
      selector: {text: {}}
    address:
      required: true
      selector: {text: {}}
    destination:
      required: true
      selector: {text: {}}
    target:
      required: true
      selector: {entity: {}}
    attribute:
      required: false
      selector: {text: {}}
    in_min:
      required: false
      default: 0
      selector: {number: {mode: box}}
    in_max:
      required: false
      default: 1
      selector: {number: {mode: box}}
    out_min:
      required: false
      default: 0
      selector: {number: {mode: box}}
    out_max:
      required: false
      default: 1
      selector: {number: {mode: box}}
    invert:
      required: false
      default: false
      selector: {boolean: {}}
    min_interval_ms:
      required: false
      default: 200
      selector: {number: {min: 0, max: 10000, mode: box}}
    deadband:
      required: false
      default: 0
      selector: {number: {min: 0, max: 100, mode: box}}

remove_control_mapping:
  name: Remove control mapping
  fields:
    entry_id:
      required: false
      description: Config entry ID when multiple DMX Monitor entries are configured.
      selector:
        text:
    mapping_id:
      required: true
      selector: {text: {}}

create_dmx_ha_mapping:
  name: Create DMX to Home Assistant mapping
  description: Map incoming DMX channels to a Home Assistant entity/service. No DMX output is generated.
  fields:
    entry_id:
      required: false
      selector:
        text:
    mapping_id:
      required: true
      selector:
        text:
    universe:
      required: true
      selector:
        number:
          min: 1
          max: 63999
          mode: box
    source:
      required: false
      selector:
        text:
    channels:
      required: true
      description: DMX channel expression, e.g. 101 or 101-103.
      selector:
        text:
    entity_id:
      required: false
      selector:
        entity:
    domain:
      required: false
      default: light
      selector:
        text:
    service:
      required: false
      default: turn_on
      selector:
        text:
    mode:
      required: false
      default: dimmer
      selector:
        select:
          options: [dimmer, rgb, rgbw, cct, switch, service]
    min_interval_ms:
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    deadband:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    invert:
      required: false
      default: false
      selector:
        boolean:
    dimmer_curve:
      required: false
      default: linear
      description: Dimmer curve applied before converting DMX to Home Assistant brightness.
      selector:
        select:
          options: [linear, gamma_1_8, gamma_2_0, gamma_2_2, gamma_2_4, logarithmic, dali_log, s_curve]
    enabled:
      required: false
      default: true
      selector:
        boolean:
    data:
      required: false
      selector:
        object:

remove_dmx_ha_mapping:
  name: Remove DMX to Home Assistant mapping
  description: Remove a persisted DMX to Home Assistant mapping.
  fields:
    entry_id:
      required: false
      selector:
        text:
    mapping_id:
      required: true
      selector:
        text:

set_dmx_ha_mapping_highlight:
  name: Highlight a DMX to Home Assistant mapping
  description: Temporarily highlights the mapped Home Assistant light and restores its previous state when disabled.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    mapping_id:
      required: true
      selector:
        text: {}
    enabled:
      required: true
      selector:
        boolean: {}

set_osc_output_enabled:
  name: Activer la sortie OSC
  description: Active ou désactive la sortie OSC globale. Désactivée par défaut.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    enabled:
      required: true
      selector: {boolean: {}}

create_osc_target:
  name: Créer une cible OSC
  description: Enregistre une cible OSC réutilisable dans les automatisations.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    target_id:
      required: true
      selector: {text: {}}
    name:
      required: false
      selector: {text: {}}
    host:
      required: true
      selector: {text: {}}
    port:
      required: false
      default: 8000
      selector: {number: {min: 1, max: 65535, mode: box}}
    enabled:
      required: false
      default: true
      selector: {boolean: {}}

remove_osc_target:
  name: Supprimer une cible OSC
  description: Supprime une cible OSC enregistrée.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    target_id:
      required: true
      selector: {text: {}}

send_osc:
  name: Envoyer OSC
  description: Envoie un message OSC UDP vers une cible enregistrée. La sortie doit être explicitement activée.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    target_id:
      required: true
      selector: {text: {}}
    address:
      required: true
      selector: {text: {}}
    args:
      required: false
      default: []
      selector: {object: {}}

set_security_password:
  name: Configurer le mot de passe Show Network
  description: Configure ou remplace le mot de passe secondaire protégeant les fonctions actives.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    current_password:
      required: false
      selector: {text: {type: password}}
    password:
      required: true
      selector: {text: {type: password}}

unlock_security:
  name: Déverrouiller les fonctions actives
  description: Déverrouille temporairement OSC OUT, Light Sync et les commandes actives.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    password:
      required: true
      selector: {text: {type: password}}

lock_security:
  name: Verrouiller les fonctions actives
  description: Verrouille immédiatement les sorties et commandes actives.
  fields:
    entry_id:
      required: false
      selector: {text: {}}


send_osc_profile_action:
  name: Send OSC bank action
  description: Send a documented OSC action from the Show Control command bank. Requires the Show Network security unlock and OSC OUT enabled.
  fields:
    entry_id:
      required: false
      selector:
        text:
    target_id:
      required: true
      selector:
        text:
    profile:
      required: true
      description: OSC profile key, for example chamsys_magicq, yamaha_rivage or qlab.
      selector:
        text:
    action:
      required: true
      description: Action key from the selected profile.
      selector:
        text:
    params:
      required: false
      description: Placeholder parameters such as playback, page or item.
      selector:
        object:
    args:
      required: false
      default: []
      description: OSC arguments (integer, float, string or boolean).
      selector:
        object:

set_device_override:
  name: Set device override
  description: Customize the display name, manufacturer, model, location, role or visibility of a discovered device.
  fields:
    unique_id:
      required: true
      selector: {text: {}}
    name:
      selector: {text: {}}
    manufacturer:
      selector: {text: {}}
    model:
      selector: {text: {}}
    location:
      selector: {text: {}}
    role:
      selector: {text: {}}
    hidden:
      selector: {boolean: {}}
    monitor_mode:
      name: Mode de surveillance
      description: Auto = Show Network décide selon les capacités; Surveiller = conserver l'équipement; Ignorer = filtrer hors du périmètre opérateur; la découverte réseau globale continue afin de ne pas masquer un équipement.
      selector:
        select:
          options: [auto, monitor, ignore]
register_manual_device:
  name: Ajouter une IP au périmètre régie
  description: Enregistre explicitement une adresse IP choisie par l’opérateur dans l’inventaire sans prétendre qu’elle a été découverte. Elle reste ensuite identifiable comme cible manuelle et peut être mise en favori.
  fields:
    ip:
      required: true
      selector: {text: {}}
    name:
      selector: {text: {}}
    role:
      selector: {text: {}}
    interface:
      selector: {text: {}}
    monitor_mode:
      selector:
        select:
          options: [auto, monitor, ignore]

clear_device_override:
  name: Clear device override
  description: Restore detected device metadata.
  fields:
    unique_id:
      required: true
      selector: {text: {}}

chaos_signal_loss:
  name: Simuler perte de signal
  description: Injecte une perte logique dans un watchdog sans couper ni filtrer aucun paquet réseau réel.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    watchdog:
      required: false
      description: Clé du watchdog. Vide = tous les watchdogs.
      selector: {text: {}}

chaos_signal_restore:
  name: Restaurer signal simulé
  description: Termine la perte logique simulée et déclenche la récupération configurée.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    watchdog:
      required: false
      selector: {text: {}}

chaos_ptp_drift:
  name: Simuler dérive PTP
  description: Injecte uniquement une valeur de diagnostic PTP simulée; le PTP réel n'est jamais modifié.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    offset_ms:
      required: true
      default: 1
      selector:
        number: {min: -1000, max: 1000, step: 0.01, mode: box}

chaos_clear:
  name: Arrêter les simulations
  description: Efface l'état de simulation Show Network.
  fields:
    entry_id:
      required: false
      selector: {text: {}}

discover_punchlight:
  name: Rechercher les PunchLight réseau
  description: Recherche passive d’équipements PunchLight DLi-LAN sur le réseau local. Aucune commande MIDI ou de contrôle n’est envoyée.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    timeout:
      required: false
      default: 2
      selector:
        number: {min: 0.5, max: 10, step: 0.5, mode: box}

archive_export:
  name: Exporter le journal Show Timeline
  description: Crée une archive ZIP du journal unifié dans la destination configurée, ou dans une destination explicitement fournie.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    target:
      required: false
      description: Chemin cible optionnel. Laisser vide pour la destination configurée.
      selector: {text: {}}

archive_set_destination:
  name: Définir la destination du journal
  description: Définit le dossier d'archivage. Peut être un dossier HA, un second disque monté ou un partage NAS/SMB déjà monté.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    destination:
      required: true
      description: Exemple /media/show_network ou /mnt/nas/show_network ou show_network_archive.
      selector: {text: {}}

archive_backup:
  name: Créer un backup du journal
  description: Crée immédiatement une archive ZIP du Show Timeline dans la destination configurée.
  fields:
    entry_id:
      required: false
      selector: {text: {}}



config_backup_create:
  name: Sauvegarder la configuration Show Network
  description: Crée un ZIP portable et vérifié de toutes les données utilisateur Show Network. Les secrets ne sont pas inclus.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    reason:
      required: false
      default: manual
      selector: {text: {}}

config_backup_restore:
  name: Restaurer une sauvegarde Show Network
  description: Restaure un ZIP de configuration validé depuis show_network_backups. Requiert le déverrouillage sécurité et recharge l'intégration.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    source:
      required: true
      description: Chemin complet d'un ZIP situé dans show_network_backups.
      selector: {text: {}}

diagnostics_export:
  name: Exporter les diagnostics Show Network
  description: Crée un bundle support expurgé des secrets avec état runtime, ressources, persistance et journal.
  fields:
    entry_id:
      required: false
      selector: {text: {}}

ha_builder_create:
  name: Créer un élément HA
  description: Crée un élément Home Assistant typé et persistant géré par Show Network.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    name:
      required: true
      selector: {text: {}}
    entity_type:
      required: false
      default: switch
      selector:
        select:
          options: [switch, sensor, binary_sensor, button, number]
    item_id:
      required: false
      selector: {text: {}}
    device_class:
      required: false
      selector: {text: {}}
    unit:
      required: false
      selector: {text: {}}
    icon:
      required: false
      selector: {text: {}}
    area:
      required: false
      selector: {text: {}}
    enabled:
      required: false
      default: true
      selector: {boolean: {}}
    state:
      required: false
      selector: {text: {}}
    min_value:
      required: false
      selector: {number: {min: -100000, max: 100000, step: 0.1, mode: box}}
    max_value:
      required: false
      selector: {number: {min: -100000, max: 100000, step: 0.1, mode: box}}
    step:
      required: false
      selector: {number: {min: 0.001, max: 10000, step: 0.001, mode: box}}

ha_builder_remove:
  name: Supprimer un élément HA Builder
  description: Supprime la définition persistante d'un élément Show Network.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    item_id:
      required: true
      selector: {text: {}}

ha_builder_set_state:
  name: Modifier l'état d'un élément HA Builder
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    item_id:
      required: true
      selector: {text: {}}
    state:
      required: true
      selector: {text: {}}

set_notification_config:
  name: Configurer les notifications Show Network
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    enabled:
      required: true
      selector: {boolean: {}}
    target:
      required: true
      description: Service notify Home Assistant ou persistent.
      selector: {text: {}}
    mode:
      required: false
      default: both
      selector:
        select:
          options: [notify, persistent, both]

create_dmx_ha_zone:
  name: Create DMX to Home Assistant zone
  description: Create a Philips-Hue-like zone driven by one dedicated incoming DMX universe. Receive-only; no DMX output.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    zone_id:
      required: true
      selector: {text: {}}
    name:
      required: true
      selector: {text: {}}
    universe:
      required: true
      selector: {number: {min: 1, max: 63999, mode: box}}
    entity_ids:
      required: true
      selector: {entity: {domain: light, multiple: true}}
    mode:
      required: false
      default: dimmer
      selector: {select: {options: [dimmer, rgb, rgbw, cct, switch]}}
    channels:
      required: true
      description: DMX channel expression, e.g. 1 or 1-3.
      selector: {text: {}}
    source:
      required: false
      selector: {text: {}}
    enabled:
      required: false
      default: true
      selector: {boolean: {}}
    rdm_enabled:
      required: false
      default: false
      selector: {boolean: {}}
    fixture_type:
      required: false
      selector: {text: {}}
    fixture_types:
      required: false
      description: JSON object mapping each HA lamp entity_id to its expected RDM fixture type.
      selector: {object: {}}
    hue_model_id:
      required: false
      selector: {text: {}}
    min_interval_ms:
      required: false
      default: 100
      selector: {number: {min: 0, max: 10000, mode: box}}
    deadband:
      required: false
      default: 0
      selector: {number: {min: 0, max: 100, mode: box}}
    invert:
      required: false
      default: false
      selector: {boolean: {}}

remove_dmx_ha_zone:
  name: Remove DMX to Home Assistant zone
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    zone_id:
      required: true
      selector: {text: {}}

set_dmx_ha_zone_enabled:
  name: Enable or disable DMX to Home Assistant zone
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    zone_id:
      required: true
      selector: {text: {}}
    enabled:
      required: true
      selector: {boolean: {}}

set_dmx_ha_zone_rdm_enabled:
  name: Enable or disable passive RDM listening for a zone
  description: This gate only permits passive RDM observations; Show Network does not perform RDM discovery or writes.
  fields:
    entry_id:
      required: false
      selector: {text: {}}
    zone_id:
      required: true
      selector: {text: {}}
