[pytest]
# pytest-homeassistant-custom-component's `hass` fixture (and others) are
# plain @pytest.fixture async generators, not @pytest_asyncio.fixture --
# pytest-asyncio's default "strict" mode does not resolve those, so tests
# using `hass` would silently receive the unresolved async_generator
# object instead of a running Home Assistant instance. "auto" mode treats
# every async def test/fixture as needing resolution, which is what these
# tests were written against.
asyncio_mode = auto
